# Windows CI (specs/002, 001, 024): builds the portable code (core, CEF
# integration, renderer) and the Windows app on Windows x64 with clang-cl,
# runs the tests and the internal pages' tests, and uploads the app for
# testing in a Windows virtual machine. Runs on pull requests, on pushes to
# main and on demand.
name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request or branch replaces a running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Specs and docs only (for example the spec of a future feature): the
  # build below is skipped, which its required check counts as passed.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci_changes.mjs >> "$GITHUB_OUTPUT"

  build-and-test:
    # Builds unless the check above ran and found only docs.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.build != 'false') }}
    # The check's name, as required by the main ruleset.
    name: windows
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      BROUK_CEF_CACHE: ${{ github.workspace }}/.cef-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/install_tools') }}

      - name: Cache CEF download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cef-cache
          key: cef-windows64-${{ hashFiles('scripts/fetch_cef') }}

      - name: Install tools
        run: scripts/install_tools

      # clang-cl needs the MSVC headers and libraries and the Windows SDK:
      # load the Visual Studio developer environment for the later steps.
      - name: Visual Studio environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])"
            }
          }

      # clang-cl is the runner's LLVM (not pinned, like clang on the Linux
      # runner); its version is printed here.
      - name: Tool versions
        run: |
          source scripts/env.sh
          clang-cl --version
          cmake --version | head -1
          cargo --version
          node --version

      - name: Internal pages (TypeScript type-check and tests)
        run: scripts/web test

      - name: Fetch CEF
        run: scripts/fetch_cef windows64

      # lld-link: Git Bash's /usr/bin/link would shadow MSVC's link.exe.
      - name: Configure (Debug)
        run: |
          source scripts/env.sh
          cmake -S . -B build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_LINKER=lld-link

      - name: Build
        run: |
          source scripts/env.sh
          # -k 0: report every compile error in one run.
          cmake --build build/debug -- -k 0

      - name: Test
        run: |
          source scripts/env.sh
          ctest --test-dir build/debug --output-on-failure

      # Starts the app, loads the test pages, crashes a renderer and quits
      # (tests/smoke/smoke.mjs); screenshots and logs are uploaded below.
      - name: Smoke test
        run: |
          # A crash ends the process instead of waiting in a dialog.
          reg add "HKCU\Software\Microsoft\Windows\Windows Error Reporting" \
            //v DontShowUI //t REG_DWORD //d 1 //f
          source scripts/env.sh
          version="$(sed -n 's/^set(APP_VERSION "\(.*\)")$/\1/p' CMakeLists.txt)"
          node tests/smoke/smoke.mjs build/debug/Brouk "$version" unknown x86_64 build/smoke

      - name: Upload the smoke test's screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-windows-${{ github.sha }}
          path: build/smoke/
          retention-days: 14
          if-no-files-found: ignore

      # The app to test in a Windows virtual machine (024): the run's page,
      # "Artifacts". A Debug build of Brouk's own code; CEF is its release
      # build.
      - name: Upload the app
        if: ${{ github.event_name != 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brouk-windows-${{ github.sha }}
          path: |
            build/debug/Brouk/
            !build/debug/Brouk/*.pdb
          retention-days: 14
          if-no-files-found: error
