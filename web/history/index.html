<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>History</title>
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="history.css">
<script type="module" src="history.js"></script>
</head>
<body>
<main>
  <header>
    <h1>History</h1>
  </header>
  <div class="search">
    <input type="search" id="query" placeholder="Search history — words, &quot;phrases&quot;, site:, after:7d, visits:&gt;3, -word, a OR b"
      aria-label="Search history" aria-describedby="query-hint" spellcheck="false" autocomplete="off">
    <p id="query-hint" class="hint" aria-live="polite" hidden></p>
    <div class="chips" role="group" aria-label="Add a filter">
      <button type="button" class="chip" data-chip="site">Site</button>
      <button type="button" class="chip" data-chip="date">Date</button>
      <button type="button" class="chip" data-chip="profile">Profile</button>
      <button type="button" class="chip" data-chip="visits">Visits</button>
      <button type="button" class="chip" data-chip="type">Type</button>
    </div>
    <div id="chip-menu" class="chip-menu" role="dialog" hidden></div>
  </div>
  <div class="toolbar" role="toolbar" aria-label="History view">
    <label>Profile <select id="profile"></select></label>
    <div class="segmented" role="group" aria-label="View">
      <button type="button" id="view-site" aria-pressed="true">By site</button>
      <button type="button" id="view-day" aria-pressed="false">By day</button>
    </div>
    <label id="sort-label">Sort <select id="sort">
      <option value="lastVisit">Last visit</option>
      <option value="visits">Visits</option>
      <option value="host">Site</option>
    </select></label>
    <span class="spacer"></span>
    <span id="selection" class="selection" hidden></span>
    <button type="button" id="delete" class="danger" hidden>Delete</button>
  </div>
  <div id="confirm" class="confirm" role="alertdialog" hidden></div>
  <p id="error" class="error" role="alert" hidden></p>
  <div id="list" class="list"></div>
  <p id="empty" class="empty" hidden>No history yet.</p>
  <p id="no-match" class="empty" hidden>Nothing matches the search.</p>
  <button type="button" id="more" hidden>Show more</button>
</main>
</body>
</html>
