<!doctype html><meta charset="utf-8"><title>Objednávka (test)</title>
<h1>Dodací a fakturační údaje</h1>
<form action="done.html" method="get">
<p><label>Jméno <input name="jmeno"></label> <label>Příjmení <input name="prijmeni"></label></p>
<p><label>E-mail <input type="email" name="email"></label> <label>Telefon <input type="tel" name="telefon"></label></p>
<p><label>Ulice a č.p. <input name="ulice"></label></p>
<p><label>Město <input name="mesto"></label> <label>PSČ <input name="psc"></label></p>
<p><label>Země <select name="zeme"><option value="CZ">Česká republika</option><option value="SK">Slovensko</option><option value="DE">Německo</option></select></label></p>
<h2>Firma</h2>
<p><label>Název firmy <input name="firma"></label></p>
<p><label>IČO <input name="ico"></label> <label>DIČ <input name="dic"></label></p>
<p><label>Číslo smlouvy <input name="smlouva"></label></p>
<p><label>Poznámka <textarea name="poznamka"></textarea></label></p>
<button type="submit">Odeslat objednávku</button>
</form>
