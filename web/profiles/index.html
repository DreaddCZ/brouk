<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Profiles</title>
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="profiles.css">
<script type="module" src="profiles.js"></script>
</head>
<body>
<main>
  <header>
    <h1>Profiles</h1>
    <p class="intro">Each profile keeps its own sign-ins, cookies, history and
      settings. Tabs of several profiles can share a window; each profile's
      tabs form one group.</p>
  </header>
  <p id="error" class="error" role="alert" hidden></p>
  <div id="notice" class="notice" role="status" hidden></div>
  <ul id="list" class="profiles" aria-label="Profiles"></ul>
  <div id="new-area"></div>
  <label class="startup">
    <input type="checkbox" id="startup">
    Show this window when Brouk starts
  </label>
</main>
</body>
</html>
