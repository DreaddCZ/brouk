# Phase 1 CI (specs/001): builds the portable code (core and CEF integration)
# on Linux and runs its tests under AddressSanitizer + UBSan, and type-checks
# and tests the internal pages (web/). macOS builds are made locally on the
# user's Macs.
name: linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Specs and docs only (for example the spec of a future feature): the
  # build below is skipped, which its required check counts as passed.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci_changes.mjs >> "$GITHUB_OUTPUT"

  build-and-test:
    # Builds unless the check above ran and found only docs.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.build != 'false') }}
    # The check's name, as required by the main ruleset.
    name: linux
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      BROUK_CEF_CACHE: ${{ github.workspace }}/.cef-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/install_tools') }}

      - name: Cache CEF download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cef-cache
          key: cef-linux64-${{ hashFiles('scripts/fetch_cef') }}

      - name: Install tools
        run: scripts/install_tools

      - name: Check formatting
        run: scripts/format --check

      - name: Internal pages (TypeScript type-check and tests)
        run: scripts/web test

      - name: Build script tests
        run: |
          source scripts/env.sh
          node --test scripts/*.test.mjs

      - name: Fetch CEF
        run: scripts/fetch_cef linux64

      - name: Configure (Debug, sanitizers on)
        run: |
          source scripts/env.sh
          cmake -S . -B build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: |
          source scripts/env.sh
          cmake --build build/debug

      - name: Test
        run: |
          source scripts/env.sh
          ctest --test-dir build/debug --output-on-failure

      - name: clang-tidy
        run: scripts/lint build/debug

