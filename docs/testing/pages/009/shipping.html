<!doctype html><meta charset="utf-8"><title>Shipping (test)</title>
<h1>Shipping address</h1>
<form action="done.html" method="get">
<p><label>Full name <input name="name" autocomplete="name"></label></p>
<p><label>Address line 1 <input name="address1" autocomplete="address-line1"></label></p>
<p><label>Address line 2 <input name="address2" autocomplete="address-line2"></label></p>
<p><label>City <input name="city" autocomplete="address-level2"></label> <label>ZIP <input name="zip" autocomplete="postal-code"></label></p>
<p><label>Country <input name="country" autocomplete="country-name"></label></p>
<p><label>Phone <input name="phone" autocomplete="tel"></label> <label>Email <input name="email" autocomplete="email"></label></p>
<p><label>VAT number <input name="vat"></label> <label>IBAN <input name="iban"></label></p>
<button type="submit">Continue</button>
</form>
